<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن | يعرب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #563A9C; --secondary-color: #28a745; --sidebar-bg: #1e2a44; --card-bg: #ffffff; --text-color: #2d3748; --border-radius: 12px; --shadow: 0 4px 12px rgba(0, 0, 0, 0.08); --transition: all 0.3s ease; --sidebar-width: 280px; }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Kufi Arabic', sans-serif; background-color: #f8fafc; min-height: 100vh; color: var(--text-color); line-height: 1.5; overflow-x: hidden; }
        .container { display: flex; width: 100%; transition: var(--transition); }
        .sidebar { background-color: var(--sidebar-bg); color: #fff; width: var(--sidebar-width); padding: 1rem 0; display: flex; flex-direction: column; transition: var(--transition); box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1); position: fixed; top: 0; bottom: 0; right: 0; z-index: 1000; }
        .sidebar.collapsed { width: 70px; }
        .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 0 1rem 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .sidebar-header h2 { font-size: 1.4rem; }
        .sidebar ul { list-style: none; width: 100%; }
        .sidebar ul li a { display: flex; align-items: center; padding: 0.875rem 1.5rem; color: #e2e8f0; text-decoration: none; font-size: 1rem; font-weight: 500; transition: var(--transition); }
        .sidebar ul li a:hover { background-color: #2d3b55; color: #fff; }
        .sidebar ul li a.active { background-color: var(--primary-color); color: #fff; }
        .sidebar ul li a i { margin-left: 0.75rem; width: 1.5rem; text-align: center; }
        .toggle-sidebar { background: var(--primary-color); color: #fff; border: none; padding: 0.5rem; border-radius: 8px; cursor: pointer; font-size: 1.2rem; transition: var(--transition); }
        .main-content { flex: 1; padding: 2rem; margin-right: var(--sidebar-width); transition: var(--transition); }
        .sidebar.collapsed ~ .main-content { margin-right: 70px; }
        .main-content h1 { font-size: 1.8rem; font-weight: 600; margin-bottom: 1.5rem; text-align: right; }
        .company-selector { margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem; }
        .company-selector select { padding: 0.5rem; border-radius: var(--border-radius); border: 1px solid #e2e8f0; font-size: 1rem; width: 300px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; margin-bottom: 2.5rem; }
        .card { background: var(--card-bg); padding: 1.5rem; border-radius: var(--border-radius); box-shadow: var(--shadow); transition: var(--transition); text-align: right; border-left: 4px solid var(--primary-color); }
        .card h3 { color: #4a5568; margin-bottom: 0.75rem; font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; }
        .card p { font-size: 1.8rem; font-weight: 700; color: var(--text-color); margin: 0.75rem 0 0.25rem; }
        .charts-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.25rem; }
        .chart-card { background: var(--card-bg); padding: 1.5rem; border-radius: var(--border-radius); box-shadow: var(--shadow); transition: var(--transition); }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2>لوحة تحكم الأدمن</h2>
                <button class="toggle-sidebar" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <ul>
                <li><a href="#" class="active"><i class="fas fa-tachometer-alt"></i><span>الرئيسية</span></a></li>
                <li><a href="#"><i class="fas fa-building"></i><span>إدارة الشركات</span></a></li>
                <li><a href="#"><i class="fas fa-box"></i><span>المنتجات</span></a></li>
                <li><a href="#"><i class="fas fa-users"></i><span>العملاء</span></a></li>
                <li><a href="../index.html"><i class="fas fa-sign-out-alt"></i><span>تسجيل الخروج</span></a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <h1>مرحبًا، الأدمن</h1>
            <div class="company-selector">
                <label for="company-select">اختر شركة:</label>
                <select id="company-select">
                    <option value="0" selected>جميع الشركات</option>
                    <option value="1">شركة الدمياطي</option>
                    <option value="2">شركة الهلب</option>
                </select>
            </div>
            <div class="cards">
                <div class="card">
                    <h3><i class="fas fa-chart-line"></i> إجمالي المبيعات</h3>
                    <p>150,000.00 جنيه</p>
                </div>
                <div class="card">
                    <h3><i class="fas fa-box"></i> المنتجات النشطة</h3>
                    <p>124</p>
                </div>
                <div class="card">
                    <h3><i class="fas fa-truck"></i> الطلبات الجديدة</h3>
                    <p>15</p>
                </div>
                <div class="card">
                    <h3><i class="fas fa-industry"></i> عدد المصانع</h3>
                    <p>8</p>
                </div>
            </div>
            <div class="charts-container">
                <div class="chart-card">
                    <h3><i class="fas fa-medal"></i> المنتجات الأكثر مبيعًا</h3>
                    <canvas id="topProductsChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3><i class="fas fa-chart-pie"></i> حالة الطلبات</h3>
                    <canvas id="orderStatusChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function renderCharts() {
            Chart.defaults.font.family = "'Noto Kufi Arabic', sans-serif";
            Chart.defaults.font.size = 12;

            new Chart(document.getElementById('topProductsChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: ['طقم أنتريه مودرن', 'غرفة نوم كلاسيك', 'طقم سفرة 6 كراسي', 'ركنة حرف L', 'سرير مفرد'],
                    datasets: [{
                        label: 'عدد المبيعات',
                        data: [15, 12, 10, 8, 5],
                        backgroundColor: ['#563A9C', '#7B5BB8', '#A68CD1', '#28a745', '#f4b400'],
                        borderRadius: 4
                    }]
                },
                options: {
                    indexAxis: 'y',
                    scales: { x: { beginAtZero: true, grid: { display: false } }, y: { grid: { display: false } } },
                    plugins: { legend: { display: false } }
                }
            });

            new Chart(document.getElementById('orderStatusChart').getContext('2d'), {
                type: 'pie',
                data: {
                    labels: ['قيد الانتظار', 'جاري التجهيز', 'تم التوصيل', 'ملغي'],
                    datasets: [{
                        data: [20, 15, 50, 5],
                        backgroundColor: ['#563A9C', '#7B5BB8', '#28a745', '#f4b400'],
                        hoverOffset: 12
                    }]
                },
                options: {
                    plugins: { legend: { position: 'bottom', labels: { font: { size: 12 }, padding: 15 } } }
                }
            });
        }

        window.addEventListener('load', () => {
            renderCharts();
        });
    </script>
</body>
</html>
